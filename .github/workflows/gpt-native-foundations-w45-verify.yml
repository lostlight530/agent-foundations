name: GPT Native W45 Foundations weekly contract
on:
  push:
    branches:
      - gpt-native/foundations-weekly-2026w45-merged
permissions:
  contents: read
jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact weekly branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate documentary evidence and native unit contract
        run: |
          python3 FOUNDATION/validate.py
          python3 -m unittest FOUNDATION.test_contract -v
      - name: Verify four paired new weekly sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          expected=["Memory_System","Tool_System","Collaboration_System","Architecture_Principles"]
          for c in expected:
              en=Path(f"docs/en/{c}.md").read_text(encoding="utf-8")
              zh=Path(f"docs/zh/{c}.md").read_text(encoding="utf-8")
              assert en.count("## 2026-W45 Weekly Research Cascade") == 1, c
              assert zh.count("## 2026-W45 Weekly Research Cascade") == 1, c
              assert "2026-11-09 FAVA" in en and "2026-11-09 FAVA" in zh, c
              assert "NOT_IMPLEMENTED" in en or "NO_NEW_CLAIM" in en, c
              assert "NOT_IMPLEMENTED" in zh or "NO_NEW_CLAIM" in zh, c
              print(c, "weekly bilingual presence PASS")
          PY
      - name: Check clean checkout
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
