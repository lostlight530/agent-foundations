name: GPT Native 2026-11-07 agent-foundations targeted verification
on:
  push:
    branches:
      - gpt-native/2026-11-07-agentltl-tool-theory
permissions:
  contents: read
jobs:
  verify-native-record:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gpt-native/2026-11-07-agentltl-tool-theory
          fetch-depth: 0
          persist-credentials: false
      - name: Targeted source and document contracts
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 --version
          python3 FOUNDATION/validate.py --base-ref 79474f8efa89dc549b5893558decb0170eaab605
          python3 -m unittest FOUNDATION/test_contract.py -v
      - name: Check canonical identity and bounded outputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/en/Tool_System.md');q=Path('docs/zh/Tool_System.md')
          a=p.read_text();b=q.read_text()
          for token in ('2026-11-07 GPT Native', '2607.02599v1', 'NOT_IMPLEMENTED', 'NOT_TESTED', 'NEXT_RETEST_CONDITION'):
           assert token in a and token in b,(token,p,q)
          print('BILINGUAL_AGENTLTL_ONE_SOURCE_PAIRED_SECTIONS_PASS')
          PY
      - name: No run-time write to repository tree
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
