name: GPT Native 2026-11-09 exact-branch contract verification
on:
  push:
    branches:
      - gpt-native/foundations-daily-20261109-fava
permissions:
  contents: read
jobs:
  contract-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Exact branch checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify native contract
        run: python3 FOUNDATION/validate.py && python3 -m unittest FOUNDATION.test_contract
      - name: Verify no checkout writes
        run: test -z "$(git status --porcelain)"
