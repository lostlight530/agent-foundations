name: Verify foundation

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate independent foundation
        run: python FOUNDATION/validate.py
      - name: Enforce protected paths
        if: github.event_name == 'pull_request'
        env:
          APPROVED_README: ${{ contains(github.event.pull_request.labels.*.name, 'scope:approved-readme') }}
        run: |
          if [ "$APPROVED_README" = "true" ]; then
            python FOUNDATION/validate.py --base-ref "origin/${{ github.base_ref }}" --allow-protected README.md
          else
            python FOUNDATION/validate.py --base-ref "origin/${{ github.base_ref }}"
          fi
      - name: Run contract regression tests
        run: python -m unittest FOUNDATION/test_contract.py -v
